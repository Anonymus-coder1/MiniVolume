name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7 (plusieurs sources au cas ou l'une est en panne)
        run: |
          for url in \
            https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip \
            https://mirrors.aliyun.com/gradle/gradle-8.7-bin.zip ; do
            echo "Essai : $url"
            if curl -fsSL --retry 2 --retry-delay 3 -o "$RUNNER_TEMP/gradle.zip" "$url"; then
              echo "OK"
              break
            fi
            rm -f "$RUNNER_TEMP/gradle.zip"
          done
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MiniVolume-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK (release "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mini Volume (dernier build)
          files: app/build/outputs/apk/debug/app-debug.apk
